<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 60vh;
            min-height: 300px;
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 8px;
        }

        canvas {
            background-color: #1e1e1e;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .chart-container {
                height: 70vh;
                padding: 4px;
            }
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <canvas id="chart"></canvas>
    </div>
    <script>
        const gridColor = "#333333";
        const textColor = "#e0e0e0";
        const isSmallScreen = window.innerWidth < 600;

        fetch("archive.json")
            .then((response) => response.json())
            .then((data) => {
                var ctx = document.getElementById("chart").getContext("2d");
                var myChart = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: data.map((item) => item.scrappedAt.slice(0, 10)),
                        datasets: data[0].periods.map(({ type, duration }) => {
                            return {
                                label: type === 'FIXED' ? `${type}-${duration / 12}y` : `${type}`,
                                data: data.map((i) =>
                                    parseFloat(
                                        i.periods
                                            .find(
                                                (period) =>
                                                    period.type === type && period.duration === duration
                                            )
                                            .rates[4].value.replace("%", "")
                                    )
                                ),
                                borderWidth: 1,
                            };
                        }),
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                ticks: {
                                    color: textColor,
                                    autoSkip: true,
                                    maxTicksLimit: isSmallScreen ? 6 : 20,
                                    maxRotation: isSmallScreen ? 45 : 90,
                                },
                                grid: { color: gridColor },
                            },
                            y: {
                                beginAtZero: true,
                                ticks: { color: textColor },
                                grid: { color: gridColor },
                            },
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: textColor,
                                    boxWidth: isSmallScreen ? 12 : 40,
                                    font: { size: isSmallScreen ? 10 : 12 },
                                },
                            },
                        },
                    },
                });
            });
    </script>
</body>

</html>
